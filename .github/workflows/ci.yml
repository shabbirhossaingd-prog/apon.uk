name: Build and QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
      - name: Check generated site
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          test -f dist/contact/index.html
          test -f dist/studyabroad/index.html
          test -f dist/startup/index.html
          test -f dist/researchdegree/index.html
          test -f dist/jobabroad/index.html
          test -f dist/opportunities/index.html
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apon-uk-dist
          path: dist
          retention-days: 7
